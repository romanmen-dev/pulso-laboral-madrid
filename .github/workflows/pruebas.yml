# Ejecuta las pruebas de tests/ en cada push y pull request, con Python 3.12
# (la versión de la aplicación publicada) y 3.13.
# No necesita los datos originales: las pruebas usan datos/publicados/ y
# series sintéticas.
name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Si falla una versión, la otra termina igualmente.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # La aplicación (requirements.txt) más pytest, con la versión fijada
      # en requirements-dev.txt.
      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "$(grep '^pytest==' requirements-dev.txt)"

      - name: Ejecutar las pruebas
        run: python -m pytest -v
